.start-btn{margin-top:.5rem;padding:14px;border:1px solid #3C3733;background:#3C3733;color:#F2EDE8;font-size:18px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;width:100%;transition:all .15s}
.start-btn:hover{background:#2A2522}

.checklist-view{display:none}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:16px;color:#9C9188;cursor:pointer;margin-bottom:1.5rem;background:none;border:none;padding:0;letter-spacing:.04em;text-transform:uppercase}
.back-btn:hover{color:#3C3733}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1.25rem}
.tag{padding:5px 13px;border:1px solid #C8BFB6;color:#9C9188;font-size:16px;letter-spacing:.05em;text-transform:uppercase}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.progress-label{font-size:17px;color:#9C9188;letter-spacing:.03em}

.progress-fill{height:100%;background:#3C3733;transition:width .3s}

.category:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.cat-header{font-size:17px;color:#B8AFA6;padding:2px 0 10px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.1em}

.cat-header .cat-count{margin-left:auto;font-size:16px;color:#C8BFB6}

.item.sub.checked .item-label{color:#C8BFB6}

.item.todo{grid-column:1/-1;margin-left:16px;border-left:1px solid #B8A882;padding-left:12px}

.history-unchecked{color:#C8BFB6;text-decoration:line-through}

<body>
<div class="wrap">
  <div class="title">外出攜帶清單</div>
  <div class="subtitle">回答幾個問題，整理這次需要帶的東西</div>
  <div class="divider"></div>

  <div class="tab-row">
    <div class="tab active" onclick="switchTab('checklist-tab')">清單</div>
    <div class="tab" onclick="switchTab('history-tab')">出行記錄</div>
  </div>

  <div id="checklist-tab">
    <div class="wizard" id="wizard">
      <div class="q-block">
        <div class="q-label">1 — 這次是哪種出行？</div>
        <div class="q-options" id="q-dest">
          <div class="q-opt" data-val="trip">國內</div>
          <div class="q-opt" data-val="overseas">出國</div>
        </div>
      </div>
      <div class="q-block">
        <input id="trip-name" type="text" placeholder="行程名稱（選填）" style="width:100%;padding:10px 0;border:none;border-bottom:1px solid #D8D0C8;background:transparent;font-size:18px;color:#3C3733;outline:none;letter-spacing:.03em">
      </div>
      <div class="q-block">
        <div class="q-label">2 — 有拍攝工作嗎？</div>
        <div class="q-options" id="q-photo">
          <div class="q-opt" data-val="yes">有</div>
          <div class="q-opt" data-val="no">沒有</div>
        </div>
      </div>
      <div class="q-block dimmed" id="qb-drone">
        <div class="q-label">3 — 需要帶空拍機嗎？</div>
        <div class="q-sub">選「有拍攝工作」後才適用</div>
        <div class="q-options" id="q-drone">
          <div class="q-opt" data-val="yes">需要</div>
          <div class="q-opt" data-val="no">不需要</div>
        </div>
      </div>
      <div class="q-block dimmed" id="qb-lights">
        <div class="q-label">4 — 需要帶燈包嗎？</div>
        <div class="q-sub">選「有拍攝工作」後才適用</div>
        <div class="q-options" id="q-lights">
          <div class="q-opt" data-val="yes">需要</div>
          <div class="q-opt" data-val="no">不需要</div>
        </div>
      </div>
      <div class="q-block dimmed" id="qb-backup">
        <div class="q-label">5 — 帶備用相機（ZV-E10）嗎？</div>
        <div class="q-sub">選「有拍攝工作」後才適用</div>
        <div class="q-options" id="q-backup">
          <div class="q-opt" data-val="yes">帶</div>
          <div class="q-opt" data-val="no">不帶</div>
        </div>
      </div>
      <div class="q-block">
        <div class="q-label">7 — 這次怎麼移動？</div>
        <div class="q-options" id="q-drive">
          <div class="q-opt" data-val="own_car">開自己的車</div>
          <div class="q-opt" data-val="rent_car">租車</div>
          <div class="q-opt" data-val="none">全部搭車</div>
        </div>
      </div>
      <div class="q-block">
        <div class="q-label">8 — 有搭台鐵／高鐵嗎？</div>
        <div class="q-options" id="q-train">
          <div class="q-opt" data-val="yes">有</div>
          <div class="q-opt" data-val="no">沒有</div>
        </div>
      </div>
      <div class="q-block">
        <div class="q-label">9 — 有游泳行程嗎？</div>
        <div class="q-options" id="q-swim">
          <div class="q-opt" data-val="yes">有</div>
          <div class="q-opt" data-val="no">沒有</div>
        </div>
      </div>
      <button class="start-btn" id="start-btn" disabled onclick="buildChecklist()">產生清單</button>
      <button class="start-btn" style="background:transparent;color:#9C9188;border-color:#C8BFB6;margin-top:0" onclick="buildAll()">全部列出（不篩選情境）</button>
    </div>

    <div class="checklist-view" id="checklist-view">
      <button class="back-btn" onclick="goBack()"><i class="ti ti-arrow-left"></i> 重新選擇</button>
      <div class="success-banner" id="success-banner"><p></p></div>
      <div class="success-banner" id="resume-banner" style="display:none"><p>↩ 已恢復上次未完成的清單</p></div>
      <div class="tags" id="tags"></div>
      <div class="toolbar">
        <div class="progress-label" id="progress-label">0 / 0 已確認</div>
        <button class="reset-btn" onclick="resetAll()">重設</button>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div id="checklist"></div>
      <div class="submit-area">
        <button class="submit-btn" onclick="submitRecord()">送出並記錄</button>
      </div>
    </div>
  </div>

  <div id="history-tab" style="display:none">
    <div class="history-title">出行記錄</div>
    <div id="history-list"></div>
  </div>
</div>

function switchTab(id){
  document.getElementById('checklist-tab').style.display=id==='checklist-tab'?'block':'none';
  document.getElementById('history-tab').style.display=id==='history-tab'?'block':'none';
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&id==='checklist-tab')||(i===1&&id==='history-tab')));
  if(id==='history-tab') renderHistory();
}

function setupQ(groupId,key){
  document.getElementById(groupId).addEventListener('click',e=>{
    const opt=e.target.closest('.q-opt');
    if(!opt)return;
    document.querySelectorAll('#'+groupId+' .q-opt').forEach(o=>o.classList.remove('selected'));
    opt.classList.add('selected');
    answers[key]=opt.dataset.val;
    if(key==='photo'){
      const isPhoto=opt.dataset.val==='yes';
      document.getElementById('qb-drone').classList.toggle('dimmed',!isPhoto);
      document.getElementById('qb-lights').classList.toggle('dimmed',!isPhoto);
      if(!isPhoto){answers.drone='no';answers.lights='no';answers.backup='no';document.querySelectorAll('#q-drone .q-opt,#q-lights .q-opt,#q-backup .q-opt').forEach(o=>o.classList.remove('selected'));}
      else{answers.drone=null;answers.lights=null;answers.backup=null;}
      document.getElementById('qb-backup').classList.toggle('dimmed',!isPhoto);
    }
    checkReady();
  });
}

function checkReady(){document.getElementById('start-btn').disabled=!Object.values(answers).every(v=>v!==null);}

function buildAll(){
  activeTags=['trip','overseas','photo','drone','lights','backup','own_car','rent_car','swim'];
  activeItems=BASE_ITEMS.map(i=>({...i,checked:false}));
  document.getElementById('tags').innerHTML='<span class="tag">全部項目</span>';
  document.getElementById('wizard').style.display='none';
  document.getElementById('success-banner').style.display='none';
  document.getElementById('checklist-view').style.display='block';
  render();
  saveProgress();
}

function buildChecklist(){
  activeTags=[answers.dest];
  if(answers.photo==='yes') activeTags.push('photo');
  if(answers.drone==='yes') activeTags.push('drone');
  if(answers.lights==='yes') activeTags.push('lights');
  if(answers.backup==='yes') activeTags.push('backup');
  if(answers.drive==='own_car') activeTags.push('own_car');
  if(answers.drive==='rent_car') activeTags.push('rent_car');
  if(answers.train==='yes') activeTags.push('train');
  if(answers.swim==='yes') activeTags.push('swim');
  activeItems=BASE_ITEMS.filter(i=>i.tags.some(t=>activeTags.includes(t))).map(i=>({...i,checked:false}));
  document.getElementById('tags').innerHTML=activeTags.map(t=>'<span class="tag">'+labelMap[t]+'</span>').join('');
  document.getElementById('wizard').style.display='none';
  document.getElementById('success-banner').style.display='none';
  document.getElementById('checklist-view').style.display='block';
  render();
  saveProgress();
}

function goBack(){
  clearProgress();
  document.getElementById('wizard').style.display='flex';
  document.getElementById('checklist-view').style.display='none';
}

function render(){
  const total=activeItems.length,done=activeItems.filter(i=>i.checked).length;
  document.getElementById('progress-label').textContent=done+' / '+total+' 已確認';
  document.getElementById('progress-fill').style.width=(total?(done/total*100):0)+'%';
  const cl=document.getElementById('checklist');cl.innerHTML='';
  const usedCats=[...new Set(activeItems.map(i=>i.cat))];
  usedCats.forEach(k=>{
    const m=CATS[k],ci=activeItems.filter(i=>i.cat===k),dc=ci.filter(i=>i.checked).length;
    const div=document.createElement('div');div.className='category';
    div.innerHTML='<div class="cat-header"><i class="ti '+m.icon+'"></i>'+m.label+'<span class="cat-count">'+dc+'/'+ci.length+'</span></div><div class="cat-items" id="c-'+k+'"></div>';
    cl.appendChild(div);
    const grid=div.querySelector('#c-'+k);
    ci.forEach(item=>{
      const el=document.createElement('label');
      let cls='item'+(item.checked?' checked':'');
      if(item.todo) cls+=' todo';
      else if(item.sub) cls+=' sub';
      else if(item.hasChild) cls+=' full';
      el.className=cls;
      el.innerHTML='<input type="checkbox"'+(item.checked?' checked':'')+' onchange="toggle('+item.id+')"><span class="item-label">'+item.label+'</span>';
      grid.appendChild(el);
    });
  });
}

const PROGRESS_KEY='packing_progress';

function saveProgress(){
  localStorage.setItem(PROGRESS_KEY,JSON.stringify({
    activeTags,
    activeItems,
    tripName:document.getElementById('trip-name').value.trim(),
    answers:{...answers}
  }));
}

function clearProgress(){localStorage.removeItem(PROGRESS_KEY);}

function restoreProgress(){
  const saved=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'null');
  if(!saved||!saved.activeItems||!saved.activeItems.length) return;
  activeTags=saved.activeTags;
  activeItems=saved.activeItems.filter(i=>BASE_ITEMS.some(b=>b.id===i.id));
  if(saved.tripName) document.getElementById('trip-name').value=saved.tripName;
  Object.assign(answers,saved.answers);
  document.getElementById('tags').innerHTML=activeTags.map(t=>'<span class="tag">'+( labelMap[t]||t)+'</span>').join('');
  document.getElementById('wizard').style.display='none';
  document.getElementById('success-banner').style.display='none';
  document.getElementById('checklist-view').style.display='block';
  const resume=document.getElementById('resume-banner');
  if(resume) resume.style.display='block';
  render();
}

function toggle(id){const i=activeItems.find(x=>x.id===id);if(i)i.checked=!i.checked;render();saveProgress();}
function resetAll(){activeItems.forEach(i=>i.checked=false);render();saveProgress();}

function submitRecord(){
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const dateStr=now.getFullYear()+'/'+pad(now.getMonth()+1)+'/'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes());
  const tripName=document.getElementById('trip-name').value.trim();
  const record={date:dateStr,name:tripName,tags:[...activeTags],items:activeItems.map(i=>({label:i.label,checked:i.checked,sub:!!i.sub,todo:!!i.todo}))};
  const history=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
  history.unshift(record);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(history));
  clearProgress();
  const banner=document.getElementById('success-banner');
  banner.querySelector('p').textContent='已記錄 — '+dateStr;
  banner.style.display='block';
  window.scrollTo(0,0);
}

function renderHistory(){
  const list=document.getElementById('history-list');
  const history=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
  if(!history.length){list.innerHTML='<div class="empty-history">尚無出行記錄</div>';return;}
  list.innerHTML=history.map((r,idx)=>
    '<div class="history-entry">'+
    '<div style="display:flex;align-items:center;justify-content:space-between">'+
    '<div class="history-date">'+r.date+(r.name?' · '+r.name:'')+'</div>'+
    '<button onclick="deleteRecord('+idx+')" style="font-size:15px;color:#B8AFA6;background:none;border:none;cursor:pointer;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;flex-shrink:0;margin-left:8px">刪除</button>'+
    '</div>'+
    '<div class="history-tags">'+r.tags.map(t=>'<span class="history-tag">'+(labelMap[t]||t)+'</span>').join('')+'</div>'+
    '<div class="history-items">'+r.items.filter(i=>!i.sub&&!i.todo).map(i=>'<span class="'+(i.checked?'history-checked':'history-unchecked')+'" style="display:inline-block;margin-right:12px">'+(i.checked?'✓ ':'')+i.label+'</span>').join('')+'</div>'+
    '</div>'
  ).join('');
}

function deleteRecord(idx){
  const history=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
  history.splice(idx,1);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(history));
  renderHistory();
}

setupQ('q-dest','dest');setupQ('q-photo','photo');setupQ('q-drone','drone');setupQ('q-lights','lights');setupQ('q-backup','backup');setupQ('q-drive','drive');setupQ('q-train','train');setupQ('q-swim','swim');
restoreProgress();
</script>
